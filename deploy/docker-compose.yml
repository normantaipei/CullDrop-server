# docker compose -f deploy/docker-compose.yml up -d   （在 repo 根目錄執行）
services:
  culldrop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: culldrop
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      CULLDROP_DEVICE_TOKENS: "${CULLDROP_DEVICE_TOKENS:?Set CULLDROP_DEVICE_TOKENS, for example iphone:<long random token>}"
      CULLDROP_PUBLIC_URL: "${CULLDROP_PUBLIC_URL:-}"
      CULLDROP_LANG: "${CULLDROP_LANG:-en}"
      CULLDROP_MIN_FREE_GB: "2"
      CULLDROP_MAX_INFLIGHT: "4"
